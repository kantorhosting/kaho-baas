name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Go version: CI uses the same Go version as the Docker image (the golang tag in
# the Dockerfile, kept up to date by Dependabot), so tests run on the toolchain
# that builds the released binary. go.mod only declares the minimum version.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Go version from Dockerfile
        id: go
        run: |
          version="$(sed -n 's/^FROM golang:\([0-9.]*\)-alpine.*/\1/p' Dockerfile | head -n 1)"
          if [ -z "$version" ]; then
            echo "Could not read the Go version from the Dockerfile"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          check-latest: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not formatted, run 'gofmt -w .':"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Check Swagger docs are up to date
        run: |
          make swagger
          if ! git diff --exit-code -- docs; then
            echo "Swagger docs are outdated, run 'make swagger' and commit the result."
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Go version from Dockerfile
        id: go
        run: |
          version="$(sed -n 's/^FROM golang:\([0-9.]*\)-alpine.*/\1/p' Dockerfile | head -n 1)"
          if [ -z "$version" ]; then
            echo "Could not read the Go version from the Dockerfile"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          check-latest: true

      # Repository and database tests start Postgres with testcontainers,
      # Docker is available on GitHub-hosted Ubuntu runners
      - name: Test
        run: go test -race -count=1 ./...

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image
        run: docker build --target prod -t kaho-baas:ci .

      - name: Build development image
        run: docker build --target dev -t kaho-baas:ci-dev .
