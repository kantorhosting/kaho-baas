name: Bug report
description: Report something that is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        **Found a security vulnerability? Do not report it here.** Follow the [Security Policy](https://github.com/kantorhosting/kaho-baas/blob/main/SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the endpoint, request headers and body if relevant.
      placeholder: |
        1. Send `POST /v1/account/sessions/register` with ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages, response bodies and relevant logs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. main @ 47fa680
  - type: dropdown
    id: environment
    attributes:
      label: How are you running Kaho?
      options:
        - Docker Compose
        - Locally with Go
        - Other
  - type: textarea
    id: context
    attributes:
      label: Additional context
